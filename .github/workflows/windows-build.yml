name: Build Python Executable for Windows

# 触发条件：当有代码推送到 main 分支时触发
on:
  push:
    branches: [ "main" ] # 你可以改成你的主分支名，比如 master
  # 或者，你也可以设置为当创建 Release 时触发：
  # release:
  #   types: [created]

jobs:
  build:
    # 指定运行环境为最新的 Windows 系统
    runs-on: windows-latest

    steps:
    # 第一步：签出（Checkout）代码
    # 这个 Action 会把你的仓库代码下载到 Runner 环境中
    - name: Checkout repository
      uses: actions/checkout@v4 # 使用官方的 checkout action

    # 第二步：设置 Python 环境
    # 指定要使用的 Python 版本
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # 你可以指定你需要的 Python 版本

    # 第三步：安装依赖项
    # 安装 requirements.txt 中列出的所有库，以及 PyInstaller
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
      # ... (previous steps) ...

      # 第四步：使用 PyInstaller 打包脚本 (GUI 版本)
      - name: Build executable with PyInstaller
        run: pyinstaller --onefile --windowed --name sms_verifier_gui kop.py # 使用 --windowed

      # 第五步：上传构建产物 (Artifact)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sms-verifier-gui-windows-exe # Artifact 的名字
          path: dist/sms_verifier_gui.exe     # 指定要上传的文件路径

