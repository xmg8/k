# 工作流程名称
name: Build 无尽冬日接码工具 for Windows (Debug Console)

# 触发条件：
# 1. 当有代码推送到 'main' 分支时触发
# 2. 允许手动从 GitHub Actions 页面触发 (workflow_dispatch)
on:
  push:
    branches: [ "main" ] # 你可以修改为你的主分支名，例如 "master"
  workflow_dispatch: # 允许手动触发

# 定义一个或多个作业 (jobs)
jobs:
  # 作业 ID
  build:
    # 指定运行此作业的虚拟机环境
    runs-on: windows-latest # 必须是 Windows 环境才能打包 .exe

    # 作业包含的一系列步骤 (steps)
    steps:
    # 第一步：签出（Checkout）代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 第二步：设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # 确保这个版本与你的开发环境兼容

    # 第三步：安装依赖项
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # 确保你的仓库根目录下有一个 requirements.txt 文件
        # 包含: requests, pyinstaller, Werkzeug, mysql-connector-python==8.2.0 (或其他可用版本)
        if (Test-Path requirements.txt) {
          # 强制重新安装并禁用缓存，确保安装最新依赖
          pip install --force-reinstall --no-cache-dir -r requirements.txt
        } else {
          Write-Host "requirements.txt not found, attempting to install packages directly."
          # 如果 requirements.txt 不存在，尝试直接安装（作为备选方案）
          pip install --no-cache-dir requests pyinstaller Werkzeug mysql-connector-python==8.2.0
        }
        # 再次确保 pyinstaller 已安装
        pip install pyinstaller

    # 第四步：使用 PyInstaller 打包脚本 (使用 --console 模式)
    # --onefile: 打包成单个 .exe 文件
    # --console: (关键!) 用于调试，运行时显示黑色命令行窗口以查看错误输出
    # --name "无尽冬日接码工具_debug": 指定生成的 .exe 文件名 (添加 _debug 后缀)
    # kop.py: 你的 Python 脚本文件名
    - name: Build executable with PyInstaller (Debug Console)
      run: pyinstaller --onefile --console --name "无尽冬日接码工具_debug" kop.py

    # 第五步：上传构建产物 (Artifact)
    - name: Upload artifact (Debug Console)
      uses: actions/upload-artifact@v4
      with:
        # Artifact 的名称 (修改!)
        name: WujinDongri-JieMa-Tool-Debug-exe
        # 要上传的文件路径 (修改!) - 必须与上面 --name 参数生成的 .exe 文件名匹配
        path: dist/无尽冬日接码工具_debug.exe
